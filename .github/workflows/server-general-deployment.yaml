name: (Server) build-deploy-invalidate-cache-action
on:
  workflow_call:
    inputs:
      docker_build_context:
        description: "Docker build context"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path with file name"
        required: true
        type: string
      environment_name:
        description: "Environment name"
        required: true
        type: string
      app_name:
        description: "Application name"
        required: true
        type: string
      k8s_namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
      runner:
        description: "Runner"
        required: true
        type: string

jobs:
  build-tag-push:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get repository name as lower case string
        id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_build_context }}
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/${{ inputs.app_name }}:${{ inputs.environment_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ inputs.dockerfile }}

  deploy:
    needs: build-tag-push
    runs-on: [self-hosted, aws, ec2runner, "${{ inputs.runner }}"]

    environment:
      name: ${{ inputs.environment_name }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: il-central-1
          role-duration-seconds: 3600

      - name: Rollout deployment restart
        run: |
          kubectl rollout restart deployment ${{ inputs.app_name }} --namespace ${{ inputs.k8s_namespace }}

      - name: Invalidate CloudFront cache
        if: ${{ inputs.environment_name  == 'development'}}
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
