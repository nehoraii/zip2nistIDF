name: Build and Push JS zip2nist Image

on:
  push:
    branches: [ dev ]


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set Short SHA
        id: short_sha_code
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check Dockerfile change
        id: dockerfile
        run: |
          # git diff --name-only ${{ github.event.before }} ${{ github.sha }}
          # if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -Eq "^(server\.js|Dockerfile1)$"; then
          #   echo "changed=true" >> $GITHUB_OUTPUT
          #   echo "Dockerfile or server.js changed → will push image"
          # else
          #   echo "changed=false" >> $GITHUB_OUTPUT
          #   echo "Dockerfile not changed → skipping image push"
          # fi
          echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: login to docker hub
        if: steps.dockerfile.outputs.changed == 'true'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}


     
      - name: build andpush to docker hub
        if: steps.dockerfile.outputs.changed == 'true'
        uses: docker/build-push-action@50fa0058d9f8c431884235ef44c496ce90806fcf
        with:
          context: .
          file: Dockerfile1
          push: true
          tags: nehoraii/zip2nist:${{ steps.short_sha_code.outputs.sha_short }}
        id: docker_push



      - name: Get image digest
        if: steps.dockerfile.outputs.changed == 'true'
        run: |
          echo "image_sha=${{ steps.short_sha_code.outputs.sha_short }}" >> "$GITHUB_OUTPUT"
        id: get_digest


      # 9️⃣ Update Deployment YAML (אופציונלי)
      # אם רוצים לשנות את image ב-YAML במקום להשתמש ב-latest
      - name: Update deployment.yaml
        if: steps.dockerfile.outputs.changed == 'true'
        run: |
          if [ -f manifests/dev/black/deployment.yaml ]; then echo "TRUE"; fi

          echo ${{ steps.short_sha_code.outputs.sha_short }}
          # מושך את השינויים האחרונים כדי למנוע סכסוכים
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git pull --rebase origin zip2nistIDF

          # משנה את התמונה ב-deployment.yml
          sed -i "s|image:.*|image: docker.io/nehoraii/zip2nist:${{ steps.short_sha_code.outputs.sha_short }}|g" manifests/dev/black/deployment.yaml

          # מחויב ושולח את השינויים
          git add manifests/dev/black/deployment.yaml
          git commit -m "Update image to latest" || true
          git push origin zip2nistIDF
    