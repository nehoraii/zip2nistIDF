apiVersion: apps/v1
kind: Deployment
metadata:
  name: zip2nist
  namespace: tikchalal-preprod
  labels:
    app: zip2nist
    project: zip2nist
    env: preprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zip2nist
  template:
    metadata:
      labels:
        app: zip2nist
        project: zip2nist
        env: preprod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2222"
    spec:
      serviceAccountName: mezah-sa-preprod
      imagePullSecrets:
        - name: tikchalal-preprod-pat
      containers:
        - name: zip2nist
          image: ghcr.io/digitalidf/zip2nist/zip2nist:preprod
          resources:
            limits:
              cpu: "0.5"
              memory: "512Mi"
            requests:
              cpu: "0.25"
              memory: "256Mi"
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: temp
          ports:
            - containerPort: 4000
          imagePullPolicy: Always

      volumes:
        - name: temp
          emptyDir:
            sizeLimit: 500Mi
